<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="claude-deck">
  <!--
    A deck of sessions with a prompt in front.

    The colour is Claude Code's terracotta, so the tab sits in the same family
    as the terminal it watches. The shape is not: Anthropic's mark is theirs,
    and a third-party dashboard wearing it with a small badge added is the kind
    of resemblance that reads as endorsement. Two offset cards say "more than
    one session" — which is the whole reason this app exists — and the chevron
    and cursor say those sessions are terminals.

    Sized for 16px first: two cards and one glyph, nothing that turns to mush
    when the browser draws it a sixth of this size.
  -->
  <rect x="7" y="2" width="23" height="23" rx="5.5" fill="#D97757" opacity="0.38"/>
  <rect x="2" y="7" width="23" height="23" rx="5.5" fill="#D97757"/>
  <path d="M7.6 13.6 L11.2 17.2 L7.6 20.8"
        fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="13.4" y="18.6" width="6.4" height="2.3" rx="1.15" fill="#fff"/>
</svg>
